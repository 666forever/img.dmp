<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>discord icon dump</title>
  <meta name="description" content="an easier way to browse icons for discord servers" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>discord icon dump</h1>
      <a class="repo-link" href="https://github.com/666forever/img.dmp" target="_blank" rel="noopener" aria-label="Open GitHub repository">
        <img src="GitHub_Lockup_White.svg" alt="GitHub" />
      </a>
    </header>

    <section class="toolbar" aria-label="Icon controls">
      <button id="gifToggle" class="gif-toggle" type="button" aria-pressed="true" aria-label="Hide GIFs">
        <span>gifs</span>
        <span class="gif-toggle-icon" aria-hidden="true"></span>
      </button>

      <input id="searchInput" type="search" placeholder="search icons…" autocomplete="off" aria-label="Search icons" />
    </section>

    <section id="gallery" class="gallery" aria-live="polite" aria-busy="true"></section>
  </main>

  <div id="viewer" class="viewer" aria-hidden="true">
    <button class="viewer-backdrop" type="button" tabindex="-1" aria-label="Close icon viewer"></button>

    <section class="viewer-panel" role="dialog" aria-modal="true" aria-label="Icon preview">
      <button id="viewerClose" class="icon-button viewer-close" type="button" aria-label="Close icon viewer">
        <span class="close-icon" aria-hidden="true"></span>
      </button>

      <div class="viewer-preview">
        <img id="viewerImage" alt="" />
      </div>

      <footer class="viewer-footer">
        <div class="viewer-meta" aria-label="File details">
          <span id="viewerDimensions">—</span>
          <span aria-hidden="true">·</span>
          <span id="viewerSize">—</span>
          <span aria-hidden="true">·</span>
          <span id="viewerExtension">—</span>
        </div>

        <button id="viewerDownload" class="icon-button viewer-download" type="button" aria-label="Download icon">
          <span class="download-icon" aria-hidden="true"></span>
        </button>
      </footer>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
