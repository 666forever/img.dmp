<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>discord icon dump</title>
  <meta name="description" content="an easier way to browse icons, stickers, and wallpapers" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>discord icon dump</h1>

      <a class="repo-link" href="https://github.com/666forever/img.dmp" target="_blank" rel="noopener" aria-label="Open GitHub repository">
        <img src="assets/svg/brand/github-lockup-white.svg" alt="GitHub" />
      </a>
    </header>

    <section class="toolbar" aria-label="Library controls">
      <nav class="content-tabs" aria-label="Content type">
        <button class="content-tab is-active" type="button" data-category="icons" aria-pressed="true">icons</button>
        <button class="content-tab" type="button" data-category="stickers" aria-pressed="false">stickers</button>
        <button class="content-tab" type="button" data-category="wallpapers" aria-pressed="false">wallpapers</button>
      </nav>

      <div class="toolbar-actions">
        <button id="gifToggle" class="gif-toggle" type="button" aria-pressed="true" aria-label="Hide GIFs">
          <span>gifs</span>
          <span class="gif-toggle-icon" aria-hidden="true"></span>
        </button>

        <label class="search-field" aria-label="Search current category">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="searchInput" type="search" placeholder="" autocomplete="off" aria-label="Search icons" />
        </label>
      </div>
    </section>

    <section id="gallery" class="gallery" aria-live="polite" aria-busy="true"></section>
  </main>

  <div id="viewer" class="viewer" aria-hidden="true">
    <button class="viewer-backdrop" type="button" tabindex="-1" aria-label="Close viewer"></button>

    <section class="viewer-panel" role="dialog" aria-modal="true" aria-label="Asset preview">
      <button id="viewerClose" class="icon-button viewer-close" type="button" aria-label="Close viewer">
        <span class="close-icon" aria-hidden="true"></span>
      </button>

      <div class="viewer-preview">
        <img id="viewerImage" alt="" />
      </div>

      <footer class="viewer-footer">
        <div class="viewer-meta" aria-label="File details">
          <span id="viewerDimensions">—</span>
          <span aria-hidden="true">·</span>
          <span id="viewerSize">—</span>
          <span aria-hidden="true">·</span>
          <span id="viewerExtension">—</span>
        </div>

        <button id="viewerDownload" class="icon-button viewer-download" type="button" aria-label="Download asset">
          <span class="download-icon" aria-hidden="true"></span>
        </button>
      </footer>
    </section>
  </div>

  <script type="module" src="assets/js/script.js"></script>
</body>
</html>
