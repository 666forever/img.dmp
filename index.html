<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>discord icon dump</title>
  <meta name="description" content="an easier way to browse icons for discord servers" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>discord icon dump</h1>

      <a class="repo-link" href="https://github.com/666forever/img.dmp" target="_blank" rel="noopener" aria-label="Open GitHub repository">
        <img src="GitHub_Lockup_White.svg" alt="GitHub" />
      </a>
    </header>

    <section class="toolbar" aria-label="Icon controls">
      <input id="searchInput" type="search" placeholder="search icons..." autocomplete="off" aria-label="Search icons" />

      <button id="gifToggle" class="gif-toggle" type="button" aria-pressed="true" aria-label="Hide GIFs">
        <span>gifs</span>
        <img id="gifToggleIcon" src="toggle-on.svg" alt="" aria-hidden="true" />
      </button>
    </section>

    <section id="gallery" class="gallery" aria-live="polite"></section>

    <div id="toast" class="toast" role="status" aria-live="polite">copied icon url</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
